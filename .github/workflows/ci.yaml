name: CI
on:
  push:
    tags:
      - 'v**'
jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yaml
  publish:
    name: Publish
    needs: test
    uses: ./.github/workflows/publish-packages.yaml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      publish-command: |
        pnpm -r -F './packages/configs/*' -F './packages/libs/*' \
            exec pnpm publish --no-git-checks --access public
