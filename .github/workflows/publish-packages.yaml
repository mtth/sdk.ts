name: Publish packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish-command:
        required: false
        type: string
        default: pnpm -r exec pnpm publish --no-git-checks
      timeout-minutes:
        required: false
        type: number
        default: 2
jobs:
  publish:
    name: Publish
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up
        uses: mtth/sdk.ts/.github/actions/setup@main
        with:
          ignore-scripts: true
      - name: Set version
        run: |
          version=${VERSION_OR_TAG#v}
          pnpm -r exec pnpm version "$version"
        env:
          VERSION_OR_TAG: ${{ inputs.version }}
      - name: Set up Node for NPM registry
        uses: actions/setup-node@v6
        with:
          node-version: '24' # TODO: Align with mise version.
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        run: ${{ inputs.publish-command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
