name: Publish packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish-command:
        required: false
        type: string
        default: pnpm -r exec pnpm publish --no-git-checks
      timeout-minutes:
        required: false
        type: number
        default: 2
jobs:
  publish:
    name: Publish
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up
        uses: mtth/sdk.ts/.github/actions/setup@main
        with:
          ignore-scripts: true
      - name: Set version
        run: pnpm -r exec pnpm version ${{ inputs.version }}
      - name: Set up Node for NPM registry
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # - name: Set up NPM credentials
      #   run: |
      #     cat >.npmrc <<EOF
      #     //registry.npmjs.org:_authToken=${NODE_AUTH_TOKEN}
      #     @mtth:registry=https://registry.npmjs.org
      #     EOF
      - name: Publish
        run: ${{ inputs.publish-command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
