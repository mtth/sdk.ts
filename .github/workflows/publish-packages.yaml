name: Publish packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish-command:
        required: false
        type: string
        default: pnpm -r exec pnpm publish --no-git-checks
      timeout-minutes:
        required: false
        type: number
        default: 2
jobs:
  publish:
    name: Publish
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up
        uses: mtth/sdk.ts/.github/actions/setup@main
        with:
          ignore-scripts: true
      - name: Set version
        run: pnpm -r exec pnpm version ${{ inputs.version }}
      - name: Publish
        run: ${{ inputs.publish-command }}
